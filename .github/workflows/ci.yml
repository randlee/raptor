name: CI

on:
  pull_request:
    branches: [main, develop, "integrat*"]
  push:
    branches: [develop, main]

jobs:
  schema:
    name: Python schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: schema/pyproject.toml

      - name: Install schema package and test dependencies
        run: python -m pip install -e 'schema[test]'

      - name: Run schema tests
        run: python -m pytest schema/tests/models schema/tests/json_schema schema/tests/storage

      - name: Type-check public package
        run: >-
          python -m mypy --strict
          schema/src/raptor_schema
          schema/tests/typing/protocol_contract.py

      - name: Verify generated schemas
        run: |
          python -m raptor_schema.generate --check --output schema/json/v1
          git diff --exit-code -- schema/json/v1

      - name: Verify built wheel outside repository
        run: |
          python -m pip wheel --no-deps ./schema --wheel-dir "$RUNNER_TEMP/raptor-wheel"
          python -m venv "$RUNNER_TEMP/raptor-wheel-venv"
          "$RUNNER_TEMP/raptor-wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/raptor-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/raptor-wheel-venv/bin/python" "$GITHUB_WORKSPACE/schema/tests/storage/wheel_smoke.py"

      - name: Validate plugin foundation
        run: |
          python -m pytest plugins/raptor/tests/foundation plugins/raptor/tests/runtime plugins/raptor/tests/runner plugins/raptor/tests/vendor
          python -m mypy --strict plugins/raptor/runtime plugins/raptor/scripts
          python plugins/raptor/scripts/validate_plugin.py \
            --guideline docs/plans/phase-a/references/claude-code-skills-agents-guidelines-v0.7.md \
            --check-frontmatter --check-registry --check-manifests --check-inventory --check-vendor

      - name: Verify deterministic schema vendor
        run: |
          python plugins/raptor/scripts/vendor_schema.py
          git diff --exit-code -- plugins/raptor/_vendor/raptor_schema plugins/raptor/plugin-manifest.json plugins/raptor/agents/registry.yaml
          python plugins/raptor/scripts/vendor_schema.py --check

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ubuntu-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ubuntu-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ubuntu-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
