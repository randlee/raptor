name: CI

on:
  pull_request:
    # `branches` filters on the PR *base*. Any branch a stacked layer can sit
    # on must be listed, or that layer's PR gets no CI at all. `*` does not
    # match `/`, which the lower-case naming rule already forbids in slugs.
    # Mirrors atm-core's list, plus `test/*` from the raptor naming convention.
    branches:
      - develop
      - main
      - "integrate/*"
      - "integration/*"
      - "sprint/*"
      - "fix/*"
      - "hotfix/*"
      - "feature/*"
      - "plan/*"
      - "docs/*"
      - "test/*"
      - "chore/*"
      - "ci/*"
      - "release/*"
      - "merge/*"
      - "evidence/*"
      - "triage/*"
  push:
    branches: [develop, main]

# One live run per ref: a new push to a PR branch cancels the queued/running
# run for the superseded commit. Pushes to develop/main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tiers:
#   always       ci-scope, docs, neutrality
#   runtime only fmt, clippy, test matrix, corpus-scripts
# Runtime jobs keep their check names on documentation-only changes: the job
# still runs (on ubuntu) and reports success through a single skip step, so a
# required check is never left pending (atm-core pattern).

jobs:
  ci-scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        shell: bash
        run: |
          # Pull requests compare with their base; pushes compare with the
          # previous head. Unknown ranges exercise runtime.
          case "${{ github.event_name }}" in
            pull_request) range_start="${{ github.event.pull_request.base.sha }}" ;;
            push)         range_start="${{ github.event.before }}" ;;
            *)            range_start="" ;;
          esac
          if [[ -z "$range_start" || "$range_start" =~ ^0+$ ]] || ! git cat-file -e "$range_start^{commit}" 2>/dev/null; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/ci_scope.py "$range_start" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Synced skills link into the upstream project's docs tree.
      - name: Check relative Markdown links
        run: python3 .github/scripts/check_md_links.py . ':(exclude).claude'

  neutrality:
    name: Enforce repository neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if rg -Pni --hidden --glob '!.git/**' --glob '!.sc/**' '(?<![[:alnum:]_])[p]3' .; then exit 1; fi

  corpus-scripts:
    name: Corpus script tests
    needs: [ci-scope]
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only pytest skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Corpus script tests are intentionally skipped for documentation-only changes."

      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - uses: actions/setup-python@v5
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        with:
          python-version: "3.11"

      - if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: pip install maturin pytest markdown sc-compose

      - if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: pip install .

      - if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python -m pytest -q tests

  fmt:
    name: Format check
    needs: [ci-scope]
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only format skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Format check is intentionally skipped for documentation-only changes."

      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - name: Install Rust toolchain
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    needs: [fmt, ci-scope]
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only clippy skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Clippy is intentionally skipped for documentation-only changes."

      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - name: Install Rust toolchain
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ubuntu-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ubuntu-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: target
          key: ubuntu-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [clippy, ci-scope]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Documentation-only changes keep the check names but run the skip step
    # on ubuntu instead of waiting for a macOS/Windows runner slot.
    runs-on: ${{ needs.ci-scope.outputs.runtime == 'true' && matrix.os || 'ubuntu-latest' }}
    steps:
      - name: Documentation-only runtime skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Runtime tests are intentionally skipped for documentation-only changes."

      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - name: Install Rust toolchain
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo build --verbose

      - name: Run tests
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo test --verbose
