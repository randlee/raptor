[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "raptor-schema"
version = "1.0.0"
description = "Consumer-neutral canonical artifact contract for Raptor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5", "pytest>=8.3,<9", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/raptor_schema"]

[tool.hatch.build.targets.wheel.force-include]
"sql/sqlite/0001_initial.sql" = "raptor_schema/sql/sqlite/0001_initial.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["raptor_schema"]
