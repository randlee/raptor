[atm]
identity = "team-lead"
default_team = "raptor"

[rmux]
session = "raptor"

# Window 1: core agents (lead + primary codex + QA)
[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
alias = "rap-lead"
model = "opus"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "raptor" }

[[rmux.windows.panes]]
name = "crap"
command = "codex -c features.hooks=true --model gpt-5.6-terra --yolo"
env = { ATM_IDENTITY = "crap", ATM_TEAM = "raptor" }

[[rmux.windows.panes]]
name = "quality-mgr"
alias = "rap-quality-mgr"
model = "sonnet"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "raptor" }

[[rmux.windows.panes]]
name = "dev-sanity"
model = "sonnet"
env = { ATM_IDENTITY = "dev-sanity", ATM_TEAM = "raptor" }

# Window 2: additional workers (luna + astra)
[[rmux.windows]]
name = "workers"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "lrap"
command = "codex -c features.hooks=true --model gpt-5.6-luna --yolo"
env = { ATM_IDENTITY = "lrap", ATM_TEAM = "raptor" }

[[rmux.windows.panes]]
name = "arap"
command = "codex -c features.hooks=true --model gpt-6-astra --yolo"
env = { ATM_IDENTITY = "arap", ATM_TEAM = "raptor" }

[startup.team-lead]
all = ["Read /codex-orchestration SKILL.md"]

[startup.quality-mgr]
all = ["This is your directive:", "@file:.claude/agents/quality-mgr.md"]

[startup.dev-sanity]
all = ["Your role is dev-sanity under atm-bd-orchestration: read .claude/agents/dev-sanity.md now (again after every compaction) and run its Startup section",
       "Use native atm send or atm ack for messages to team-lead",
       "Use native atm read to read messages from team-members" ]
